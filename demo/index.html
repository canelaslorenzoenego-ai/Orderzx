<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>dsh-browser — panel demo (real components, scripted transport)</title>
<style>
  :root {
    --dsw-bg-primary: #101014;
    --dsw-bg-secondary: #16161a;
    --dsw-border-color: rgba(128,128,128,0.22);
    --dsw-text-primary: rgba(255,255,255,0.92);
    --dsw-text-secondary: rgba(255,255,255,0.58);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0b0b0f;
    color: var(--dsw-text-primary);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
    overflow: hidden;
  }
  #root, .page { height: 100%; }
  .page { display: flex; flex-direction: column; position: relative; }

  /* fake DSH conversation */
  .conversation { flex: 1 1 auto; overflow-y: auto; padding: 18px 20px 8px; display: flex; flex-direction: column; gap: 10px; transition: margin-right 180ms cubic-bezier(0.22,0.61,0.36,1); }
  .bubble { max-width: 640px; padding: 9px 13px; border-radius: 12px; font-size: 13px; }
  .bubble.user { align-self: flex-end; background: rgba(88,166,255,0.16); border: 1px solid rgba(88,166,255,0.3); }
  .bubble.agent { align-self: flex-start; background: var(--dsw-bg-secondary); border: 1px solid var(--dsw-border-color); }
  .bubble .dim { color: var(--dsw-text-secondary); }
  .toolcard { align-self: flex-start; display: flex; align-items: center; gap: 8px; padding: 6px 9px; border-radius: 8px; font-size: 11.5px; border: 1px solid rgba(63,185,80,0.35); background: rgba(63,185,80,0.1); }

  /* fake chatbar */
  .chatbar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--dsw-border-color); background: var(--dsw-bg-secondary); transition: margin-right 180ms cubic-bezier(0.22,0.61,0.36,1); }
  .chatbar .input-mock { flex: 1 1 auto; height: 38px; border-radius: 10px; border: 1px solid var(--dsw-border-color); background: rgba(0,0,0,0.25); display: flex; align-items: center; padding: 0 12px; color: var(--dsw-text-secondary); }
  .runbtn { flex: 0 0 auto; height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid rgba(63,185,80,0.5); background: rgba(63,185,80,0.2); color: #fff; font-weight: 650; font-size: 12.5px; cursor: pointer; }
  .runbtn:disabled { opacity: 0.45; cursor: default; }
  .resetbtn { flex: 0 0 auto; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--dsw-border-color); background: transparent; color: var(--dsw-text-secondary); font-size: 12px; cursor: pointer; }
  .phonebtn { flex: 0 0 auto; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(163,113,247,0.5); background: rgba(163,113,247,0.14); color: #fff; font-size: 12px; cursor: pointer; }
  .phonebtn.on { background: rgba(163,113,247,0.4); }

  /* phone device frame */
  body.phone { display: flex; align-items: center; justify-content: center; background: #050507; }
  body.phone #root { width: 390px; height: 844px; max-height: 96vh; border-radius: 34px; border: 3px solid #26262c; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,0.7); position: relative; }

  /* mock "streamed page" */
  .streamwrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b0b0f; overflow: hidden; }
  .mockpage { position: relative; width: 100%; height: 100%; background: #fff; color: #17171b; overflow: hidden; }
  .mockpage .mhead { position: absolute; left: 0; right: 0; top: 0; height: 14%; background: #101828; display: flex; align-items: center; gap: 10px; padding: 0 14px; }
  .mockpage .logo { color: #fff; font-weight: 800; font-size: 14px; letter-spacing: 0.4px; }
  .mockpage .search { position: absolute; left: 30%; right: 38%; top: 4.2%; height: 5.6%; border-radius: 8px; background: #f4f4f6; border: 1px solid #d9d9e0; display: flex; align-items: center; padding: 0 10px; color: #8a8a94; font-size: 11px; }
  .mockpage .hero { position: absolute; left: 6%; right: 6%; top: 18%; height: 20%; border-radius: 12px; background: linear-gradient(120deg, #dbeafe, #ede9fe); display: flex; align-items: center; padding: 0 18px; font-weight: 700; color: #312e81; font-size: 15px; }
  .mockpage .grid { position: absolute; left: 6%; right: 6%; top: 42%; bottom: 6%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .mockpage .prod { border: 1px solid #e4e4ea; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: #fff; }
  .mockpage .thumb { flex: 1 1 auto; border-radius: 8px; background: linear-gradient(140deg,#f1f5f9,#e2e8f0); }
  .mockpage .pname { font-size: 11.5px; font-weight: 600; color: #26262c; }
  .mockpage .price { font-size: 12px; color: #0f766e; font-weight: 700; }
  .mockpage .cartbtn { border: none; border-radius: 8px; background: #101828; color: #fff; font-size: 11px; font-weight: 650; padding: 7px 8px; cursor: default; }
  .mockpage.mobile-site .grid { grid-template-columns: 1fr; }
  .mockpage.mobile-site .hero { font-size: 12px; }
  .mockpage.mobile-site .interstitial { position: absolute; inset: auto 8% 8% 8%; background: #111; color: #fff; border-radius: 12px; padding: 12px; font-size: 11px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
  .mockpage .research { position: absolute; inset: 0; background: #fbfaf7; padding: 16px; overflow: hidden; }
  .mockpage .research h2 { margin: 0 0 8px; font-size: 15px; color: #44403c; }
  .mockpage .research .rrow { border-bottom: 1px solid #e7e5e4; padding: 8px 2px; font-size: 11.5px; color: #57534e; }
  .mockpage .research .rrow b { color: #1c1917; display: block; font-size: 12.5px; }

  .demobanner { position: fixed; left: 10px; bottom: 8px; z-index: 999; font-size: 10px; color: rgba(255,255,255,0.42); background: rgba(0,0,0,0.55); padding: 3px 8px; border-radius: 6px; pointer-events: none; }
  body.phone .demobanner { display: none; }
  .panelheader { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--dsw-border-color); background: var(--dsw-bg-secondary); }
  .panelheader .t { flex: 1 1 auto; min-width: 0; }
  .panelheader .t b { display: block; font-size: 12.5px; }
  .panelheader .t span { display: block; font-size: 10.5px; color: var(--dsw-text-secondary); }
  .iconbtn { flex: 0 0 auto; min-width: 30px; height: 28px; border-radius: 8px; border: 1px solid var(--dsw-border-color); background: transparent; color: var(--dsw-text-secondary); cursor: pointer; font-size: 12px; }
  .iconbtn.on { border-color: rgba(163,113,247,0.6); color: #d6bcfa; background: rgba(163,113,247,0.16); }
  .panelfooter { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--dsw-border-color); background: var(--dsw-bg-secondary); font-size: 11px; color: var(--dsw-text-secondary); }
  .streambody { position: relative; flex: 1 1 auto; min-height: 0; margin: 10px; border-radius: 10px; overflow: hidden; border: 1px solid var(--dsw-border-color); background: #0b0b0f; }
  .placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--dsw-text-secondary); font-size: 12px; background: #0b0b0f; }
</style>
</head>
<body>
<div id="root"></div>
<div class="demobanner">demo harness · scripted transport · REAL shipped components (capsule, tabs, home, timeline, gesture overlay) from lib/client.js</div>
<script>window.process = { env: { NODE_ENV: 'production' } };</script>
<script src="/node_modules/react/umd/react.production.min.js"></script>
<script src="/node_modules/react-dom/umd/react-dom.production.min.js"></script>
<script>
  // Minimal CJS interop so the real bundle's externals resolve in a browser.
  window.__dshDemoRequire = function (id) {
    switch (id) {
      case 'react': return window.React;
      case 'react-dom': return window.ReactDOM;
      case 'react-dom/client': return { createRoot: window.ReactDOM.createRoot, hydrateRoot: window.ReactDOM.hydrateRoot };
      case 'react/jsx-runtime': {
        const jsx = (type, props, key) => {
          const { children, ...rest } = props ?? {};
          if (key !== undefined) rest.key = key;
          return window.React.createElement(type, rest, children);
        };
        return { jsx, jsxs: jsx, jsxDEV: jsx, Fragment: window.React.Fragment };
      }
      default: throw new Error('demo: unexpected require(' + id + ')');
    }
  };
</script>
<script>
  // lib/client.js is the SHIPPED artifact: build-client.mjs wraps the bundle in
  // DSH's `__ModuleLoader__` envelope (`factory(require)` → exports). Provide
  // that loader — the same contract the harness page offers — and the real
  // bundle runs here unmodified.
  window.__ModuleLoader__ = {
    load({ factory }) {
      window.DSHBrowserClient = factory(window.__dshDemoRequire);
    },
  };
</script>
<script src="/lib/client.js"></script>
<script>
  if (window.DSHBrowserClient) {
    const s = document.createElement('script');
    s.src = '/demo/demo.js';
    document.body.append(s);
  } else {
    document.getElementById('root').textContent = 'lib/client.js did not register with __ModuleLoader__';
  }
</script>
</body>
</html>
