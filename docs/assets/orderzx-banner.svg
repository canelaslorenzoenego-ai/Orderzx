<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Orderzx — a fully autonomous, stealth-first browser for DeepSeek Harness. Left: the Orderzx wordmark over a dark neon grid with feature pills. Right: an animated browser panel mock with session tabs, a live page stream and the agent's ghost cursor.">
  <style><![CDATA[
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: rgba(255,255,255,.92); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .kicker { font-size: 14px; letter-spacing: 3.2px; fill: #7ee787; }
    .word { font-size: 104px; font-weight: 800; letter-spacing: -2px; fill: url(#wordgrad); }
    .tag  { font-size: 20px; fill: rgba(255,255,255,.78); }
    .pill-t { font-size: 12.5px; fill: rgba(255,255,255,.85); }
    .url  { font-size: 12px; fill: rgba(255,255,255,.55); }
    .stat { font-size: 11.5px; fill: rgba(255,255,255,.5); }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink {
      0%, 49%  { opacity: 1; }
      50%,100% { opacity: 0; }
    }
    .scan { animation: scan 5.5s linear infinite; }
    @keyframes scan {
      0%   { transform: translateY(0); opacity: 0; }
      8%   { opacity: .5; }
      92%  { opacity: .5; }
      100% { transform: translateY(252px); opacity: 0; }
    }
    .cursor { animation: drift 6s ease-in-out infinite; }
    @keyframes drift {
      0%,100% { transform: translate(0, 0); }
      45%     { transform: translate(-96px, 58px); }
      55%     { transform: translate(-96px, 58px); }
    }
    .ripple { animation: ripple 6s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes ripple {
      0%, 44%  { transform: scale(0.2); opacity: 0; }
      50%      { transform: scale(1); opacity: .8; }
      62%,100% { transform: scale(2.1); opacity: 0; }
    }
    .led { animation: led 2.4s ease-in-out infinite; }
    @keyframes led {
      0%,100% { opacity: 1; }
      50%     { opacity: .35; }
    }
    .g1 { animation: glow 3.2s ease-in-out infinite; }
    .g2 { animation: glow 3.2s ease-in-out infinite .4s; }
    .g3 { animation: glow 3.2s ease-in-out infinite .8s; }
    .g4 { animation: glow 3.2s ease-in-out infinite 1.2s; }
    .g5 { animation: glow 3.2s ease-in-out infinite 1.6s; }
    @keyframes glow {
      0%,100% { opacity: .85; }
      50%     { opacity: .45; }
    }
  ]]></style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060c"/>
      <stop offset="1" stop-color="#0a1424"/>
    </linearGradient>
    <linearGradient id="wordgrad" gradientUnits="userSpaceOnUse" x1="62" y1="120" x2="520" y2="205">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="panelClip"><rect x="762" y="66" width="452" height="288" rx="14"/></clipPath>
    <clipPath id="screenClip"><rect x="774" y="146" width="428" height="164"/></clipPath>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="250" cy="430" rx="480" ry="260" fill="url(#glowCyan)"/>
  <ellipse cx="1080" cy="400" rx="420" ry="240" fill="url(#glowGreen)"/>

  <!-- ── left: wordmark ─────────────────────────────────────────── -->
  <text class="mono kicker" x="66" y="86">DEEPSEEK HARNESS PLUGIN · DSH-BROWSER</text>
  <text class="word" x="62" y="196">Orderzx</text>
  <text class="tag" x="66" y="240">A fully autonomous, stealth-first browser the model drives —</text>
  <text class="tag" x="66" y="268">and you watch every click live.<tspan class="mono caret" fill="#3fb950"> ▌</tspan></text>

  <!-- feature pills -->
  <g class="mono pill-t">
    <g class="g1"><rect x="66" y="300" width="146" height="30" rx="15" fill="#58a6ff" fill-opacity="0.10" stroke="#58a6ff" stroke-opacity="0.45"/><text x="139" y="319" text-anchor="middle">Patchright stealth</text></g>
    <g class="g2"><rect x="222" y="300" width="152" height="30" rx="15" fill="#d29922" fill-opacity="0.10" stroke="#d29922" stroke-opacity="0.45"/><text x="298" y="319" text-anchor="middle">CAPTCHA handoff</text></g>
    <g class="g3"><rect x="384" y="300" width="176" height="30" rx="15" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950" stroke-opacity="0.45"/><text x="472" y="319" text-anchor="middle">Live stream + takeover</text></g>
    <g class="g4"><rect x="66" y="340" width="94" height="30" rx="15" fill="#bc8cff" fill-opacity="0.10" stroke="#bc8cff" stroke-opacity="0.45"/><text x="113" y="359" text-anchor="middle">22 tools</text></g>
    <g class="g5"><rect x="170" y="340" width="176" height="30" rx="15" fill="#67e8f9" fill-opacity="0.10" stroke="#67e8f9" stroke-opacity="0.45"/><text x="258" y="359" text-anchor="middle">Set-of-marks vision</text></g>
  </g>

  <!-- ── right: browser panel mock ──────────────────────────────── -->
  <g>
    <rect x="762" y="66" width="452" height="288" rx="14" fill="#0d1526" stroke="#58a6ff" stroke-opacity="0.35"/>
    <!-- titlebar + session tabs -->
    <g clip-path="url(#panelClip)">
      <rect x="762" y="66" width="452" height="34" fill="#101b30"/>
      <circle cx="782" cy="83" r="4" fill="#f85149" opacity="0.8"/>
      <circle cx="796" cy="83" r="4" fill="#d29922" opacity="0.8"/>
      <circle cx="810" cy="83" r="4" fill="#3fb950" opacity="0.8"/>
      <!-- home tab -->
      <rect x="828" y="72" width="72" height="24" rx="7" fill="#1c2b47" stroke="#58a6ff" stroke-opacity="0.5"/>
      <text class="mono" x="864" y="88" font-size="10.5" text-anchor="middle" fill="rgba(255,255,255,.85)">Home</text>
      <!-- session tab 1 (selected) -->
      <rect x="906" y="72" width="120" height="24" rx="7" fill="#16233c" stroke="#3fb950" stroke-opacity="0.55"/>
      <circle cx="920" cy="84" r="6.5" fill="hsl(195,70%,45%)"/>
      <text class="mono" x="920" y="87.5" font-size="8" text-anchor="middle" fill="#04060c">E</text>
      <text class="mono" x="932" y="88" font-size="10" fill="rgba(255,255,255,.8)">researcher</text>
      <circle class="led" cx="1008" cy="84" r="3" fill="#3fb950"/>
      <text x="1018" y="88" font-size="10" fill="rgba(255,255,255,.45)">×</text>
      <!-- session tab 2 -->
      <rect x="1032" y="72" width="92" height="24" rx="7" fill="#101b30" stroke="#58a6ff" stroke-opacity="0.2"/>
      <circle cx="1046" cy="84" r="6.5" fill="hsl(280,60%,55%)"/>
      <text class="mono" x="1046" y="87.5" font-size="8" text-anchor="middle" fill="#04060c">S</text>
      <text class="mono" x="1058" y="88" font-size="10" fill="rgba(255,255,255,.6)">shopper</text>
      <text x="1112" y="88" font-size="10" fill="rgba(255,255,255,.45)">×</text>

      <!-- url bar -->
      <rect x="774" y="110" width="428" height="26" rx="8" fill="#0a1220" stroke="#58a6ff" stroke-opacity="0.2"/>
      <circle cx="790" cy="123" r="3.2" fill="#3fb950"/>
      <text class="mono url" x="802" y="127">https://restaurant.example/menu</text>
      <text class="mono url" x="1150" y="127" text-anchor="end">⟳</text>

      <!-- page content skeleton -->
      <g clip-path="url(#screenClip)">
        <rect x="774" y="146" width="428" height="164" fill="#0b1322"/>
        <rect x="790" y="160" width="150" height="12" rx="4" fill="#58a6ff" fill-opacity="0.35"/>
        <rect x="790" y="182" width="250" height="8" rx="3" fill="rgba(255,255,255,.10)"/>
        <rect x="790" y="196" width="210" height="8" rx="3" fill="rgba(255,255,255,.07)"/>
        <rect x="790" y="216" width="120" height="64" rx="6" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.10)"/>
        <rect x="922" y="216" width="120" height="64" rx="6" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.10)"/>
        <rect x="1054" y="216" width="120" height="64" rx="6" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.10)"/>
        <rect x="800" y="228" width="100" height="7" rx="3" fill="rgba(255,255,255,.12)"/>
        <rect x="800" y="242" width="70" height="7" rx="3" fill="rgba(255,255,255,.08)"/>
        <rect x="800" y="262" width="44" height="10" rx="5" fill="#3fb950" fill-opacity="0.55"/>
        <!-- the button the ghost cursor is about to press -->
        <rect x="1074" y="262" width="80" height="14" rx="7" fill="#58a6ff" fill-opacity="0.28" stroke="#58a6ff" stroke-opacity="0.6"/>
        <!-- scanline sweep -->
        <rect class="scan" x="774" y="146" width="428" height="3" fill="#67e8f9" opacity="0.5"/>
      </g>

      <!-- ghost cursor + click ripple over the stream -->
      <g clip-path="url(#screenClip)">
        <circle class="ripple" cx="1114" cy="269" r="9" fill="none" stroke="#67e8f9" stroke-width="1.6"/>
        <g class="cursor">
          <path d="M1114 269 l0.5 14.5 3.9-3.9 2.6 5.9 2.6-1.1-2.6-5.9 5.4-0.6z" transform="translate(0,-2) scale(1.05)" fill="#e6edf3" stroke="#0d1526" stroke-width="1"/>
        </g>
      </g>

      <!-- status row -->
      <rect x="762" y="318" width="452" height="36" fill="#101b30"/>
      <circle class="led" cx="784" cy="336" r="4" fill="#3fb950"/>
      <text class="mono stat" x="796" y="340">live · 1366×768 · humanized · patchright</text>
      <text class="mono stat" x="1200" y="340" text-anchor="end">[ Take over ]</text>
    </g>
  </g>

  <!-- corner accent -->
  <path d="M0 416 h1280" stroke="#3fb950" stroke-opacity="0.25" stroke-width="2"/>
</svg>
